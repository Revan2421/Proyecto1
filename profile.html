<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile | Luis Garcia</title>
    <link rel="icon" sizes="192x192" href="icon/cropped-logonuevo-192x192.png">
    <link rel="stylesheet" href="css/style.css">
    <script src="./js/profile.js" defer></script>
</head>

<body>
    <header>
        <a class="logo" href="index.html" id="titulo-ATI"></a>
        <nav class="nav-search">
            <input type="text" id="input-busqueda">
            <button type="button" class="buscar-boton" id="btn-busqueda"></button>
        </nav>

        <div class="user-icon" id="icono-perfil"></div>
        <div class="menu-icon" id="icono-menu"></div>
    </header>

    <section class="main-content">
        <div class="content-img">
            <img class="img-profile" src="" alt="" id="foto-perfil">
        </div>
        <div class="content-info">
            <h1 class="Nombre" id="Nombre_persona"></h1>
            <p class="cover-letter" id="descripcion_value"></p>
            <table class="bullets">
                <tr>
                    <td id="Color_Fav"></td>
                    <td id="Color_Value"></td>
                </tr>
                <tr>
                    <td id="Libro_Fav"></td>
                    <td id="Libro_Value"></td>
                </tr>
                <tr>
                    <td id="Genero_Musica"></td>
                    <td id="Musica_Value"></td>
                </tr>
                <tr>
                    <td id="Game_Fav"></td>
                    <td id="Game_value"></td>
                </tr>
                <tr style="font-weight: bold;">
                    <td id="Lenguaje_Fav"></td>
                    <td id="Lenguaje_Value"></td>
                </tr>
            </table>

            <p class="bullets" style="margin-top: 15px;">
                <span id="texto-correo"></span><br>
                <a class="link-correo" href="" id="correo_value"></a>
            </p>
        </div>
    </section>
    <footer>
        <p id="copyright"></p>
    </footer>
</body>

</html>
